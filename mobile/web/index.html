<header id="top" class="topbar"></header>

<!-- Mini reproductor, siempre encima de la barra de navegación. -->
<div id="mini" class="mini" hidden>
  <div class="mini-prog"><i id="miniBar"></i></div>
  <img id="miniArt" class="mini-art" alt="" width="40" height="40">
  <div class="mini-text"><div id="miniTitle" class="t1"></div><div id="miniSub" class="t2"></div></div>
  <button class="icon-btn new-only" data-act="cast" aria-label="Cast"><svg class="ic"><use href="#i-cast"/></svg></button>
  <button class="icon-btn" data-act="toggle" aria-label="Play/Pause"><svg class="ic"><use id="miniPlayIc" href="#i-play"/></svg></button>
  <button class="icon-btn old-only" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
</div>

<nav id="nav" class="nav">
  <a href="/" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
  <a href="/samples" data-tab="samples"><svg class="ic"><use href="#i-samples"/></svg><span>Samples</span></a>
  <a href="/explore" data-tab="explore"><svg class="ic"><use href="#i-explore"/></svg><span>Explore</span></a>
  <a href="/library" data-tab="library"><svg class="ic"><use href="#i-library"/></svg><span>Library</span></a>
</nav>

<!-- Reproductor completo (diseño 2025). -->
<section id="player" class="player" aria-hidden="true">
  <div class="pl-top">
    <button class="icon-btn" data-act="closePlayer" aria-label="Close"><svg class="ic"><use href="#i-down"/></svg></button>
    <div class="seg"><button class="on" id="segSong" data-act="modeSong" aria-label="Song"><svg class="ic s20"><use href="#i-headphones"/></svg></button><button id="segVideo" data-act="modeVideo" aria-label="Video"><svg class="ic s20"><use href="#i-video"/></svg></button></div>
    <div class="row-ic">
      <button class="icon-btn" data-act="cast" aria-label="Cast"><svg class="ic"><use href="#i-cast"/></svg></button>
      <button class="icon-btn" data-act="playerMenu" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
  </div>
  <div class="pl-body">
    <div class="pl-art-wrap"><div class="pl-art-box" id="plArtBox"><div class="pa"><img id="plArt" alt=""></div><div class="pa peek prev"><img id="plArtPrev" alt=""></div><div class="pa peek next"><img id="plArtNext" alt=""></div></div><video id="plVideo" class="pl-video" muted playsinline disablepictureinpicture disableremoteplayback preload="metadata" hidden></video></div>
    <div class="pl-info" data-act="goAlbum">
      <div class="pl-titles"><div class="pl-title"><span id="plTitle"></span><svg class="ic s28"><use href="#i-chev"/></svg></div><div id="plArtist" class="pl-artist" data-act="goArtist"></div></div>
    </div>
    <div class="pl-chips" id="plChips">
      <div class="chip-pair"><button data-act="like" aria-label="Like"><svg class="ic s20"><use id="plLikeIc" href="#i-like"/></svg><span id="plLikeN"></span></button><i></i><button data-act="dislike" aria-label="Dislike"><svg class="ic s20"><use id="plDislikeIc" href="#i-dislike"/></svg></button></div>
      <button class="pchip" data-act="sheet" data-tab="lyrics"><svg class="ic s20"><use href="#i-quote"/></svg><span>Lyrics</span></button>
      <button class="pchip old-only" data-act="sheet" data-tab="related" aria-label="Related"><svg class="ic s20"><use href="#i-related"/></svg></button>
      <button class="pchip" data-act="saveCurrent"><svg class="ic s20"><use id="plSaveIc" href="#i-save"/></svg><span>Save</span></button>
      <button class="pchip" data-act="dlCurrent" id="plDl"><svg class="ic s20"><use id="plDlIc" href="#i-dl"/></svg><span id="plDlTxt">Download</span></button>
      <button class="pchip" data-act="shareCurrent" aria-label="Share"><svg class="ic s20"><use href="#i-share"/></svg></button>
    </div>
    <div class="seek" id="seek">
      <div class="seek-track"><i id="seekBuf"></i><i id="seekFill"></i><b id="seekThumb"></b></div>
    </div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="controls">
      <button class="icon-btn" data-act="shuffle" id="btnShuffle" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn big" data-act="prev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="play-btn" data-act="toggle" aria-label="Play/Pause"><svg class="ic"><use id="plPlayIc" href="#i-play"/></svg></button>
      <button class="icon-btn big" data-act="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
      <button class="icon-btn" data-act="repeat" id="btnRepeat" aria-label="Repeat"><svg class="ic"><use id="repeatIc" href="#i-repeat"/></svg></button>
    </div>
    <!-- Cola: aparece al deslizar hacia arriba (la carátula se achica). -->
    <div class="pl-queue" id="plQueue">
      <div class="q-head"><div class="grow"><div class="q-from">Playing from</div><div class="q-name" id="qName"></div></div><button class="pill" data-act="saveQueue"><svg class="ic s20"><use href="#i-save"/></svg>Save</button></div>
      <div id="qList" class="q-list"></div>
    </div>
  </div>
  <div class="pl-bottom" id="plBottom" data-act="queueToggle">
    <div class="grab"></div>
    <div class="pl-from" id="plFrom"></div>
  </div>

  <!-- Letras / Relacionado: hoja con la cabecera del mini reproductor. -->
  <div id="sheet" class="sheet">
    <div class="sh-head">
      <img id="shArt" class="mini-art" alt="" width="48" height="48">
      <div class="mini-text"><div id="shTitle" class="t1"></div><div id="shSub" class="t2"></div></div>
      <button class="icon-btn" data-act="cast" aria-label="Cast"><svg class="ic"><use href="#i-cast"/></svg></button>
      <button class="icon-btn" data-act="toggle" aria-label="Play/Pause"><svg class="ic s32"><use id="shPlayIc" href="#i-play"/></svg></button>
    </div>
    <div class="sh-card">
      <div class="grab" data-act="closeSheet"></div>
      <div class="sh-ttl"><span id="shName"></span><span class="grow"></span><button class="icon-btn" id="lyrScript" data-act="lyrScript" aria-label="Romanize" hidden><svg class="ic"><use href="#i-translit"/></svg></button><button class="icon-btn" data-act="closeSheet" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div id="shBody" class="sh-body"></div>
      <button class="share-fab" id="shareFab" data-act="shareLyrics" hidden><svg class="ic s20"><use href="#i-spark"/></svg>Share</button>
    </div>
  </div>
</section>

<div id="scrim" class="scrim" hidden></div>
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>

<audio id="audio" preload="auto"></audio>
<script src="/i18n.js" defer></script>
<script src="/app.js" defer></script>
