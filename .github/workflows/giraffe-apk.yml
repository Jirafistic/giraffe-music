# Giraffe Music: compila el APK y publica el release, que es de donde la app baja sus
# actualizaciones. Para publicar: pestaña Actions → "Giraffe Music APK" → Run workflow →
# escribí la versión (ej. v0.3.0). También publica si se empuja una etiqueta vX.Y.Z.
#
# Secretos del repo (Settings → Secrets and variables → Actions):
#   GIRAFFE_KEYSTORE_B64       la llave de firma en base64 (base64 -w0 mi-llave.jks)
#   GIRAFFE_KEYSTORE_PASSWORD  su contraseña
#   GIRAFFE_KEY_ALIAS          el alias de la llave
# Sin ellos se firma con la llave de depuración (solo para probar: no se puede actualizar encima).
name: Giraffe Music APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. v0.3.0). Vacío: solo compilar."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # La versión que se publica: la del botón "Run workflow" o la de la etiqueta empujada.
      VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # El Android SDK ya viene instalado en las máquinas de GitHub: solo se agregan las piezas.
      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sm=$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sm" --licenses > /dev/null || true
          "$sm" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: mobile }
      - run: cargo install cargo-ndk --locked
      - name: Llave de firma
        env:
          KS: "${{ secrets.GIRAFFE_KEYSTORE_B64 }}"
          HAS_PW: "${{ secrets.GIRAFFE_KEYSTORE_PASSWORD != '' }}"
          HAS_ALIAS: "${{ secrets.GIRAFFE_KEY_ALIAS != '' }}"
          AS_VARS: "${{ vars.GIRAFFE_KEYSTORE_B64 != '' || vars.GIRAFFE_KEYSTORE_PASSWORD != '' || vars.GIRAFFE_KEY_ALIAS != '' }}"
        run: |
          # Dice qué secreto falta (nunca muestra su valor).
          echo "Secretos vistos: llave=$([ -n "$KS" ] && echo sí || echo NO) contraseña=$HAS_PW alias=$HAS_ALIAS"
          if [ "$AS_VARS" = true ]; then
            echo "::error::Los datos de la llave están guardados como *Variables* (públicas). Borralos de la pestaña Variables y crealos en la pestaña *Secrets*."
          fi
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/giraffe.jks"
            echo "GIRAFFE_KEYSTORE=$RUNNER_TEMP/giraffe.jks" >> "$GITHUB_ENV"
          elif [ -n "$VERSION" ]; then
            # Un release firmado con otra llave no se podría instalar encima: mejor no publicar.
            echo "::error::Faltan los secretos GIRAFFE_KEYSTORE_B64 / GIRAFFE_KEYSTORE_PASSWORD / GIRAFFE_KEY_ALIAS"
            exit 1
          fi
      - name: Build
        working-directory: mobile
        env:
          GIRAFFE_KEYSTORE_PASSWORD: "${{ secrets.GIRAFFE_KEYSTORE_PASSWORD }}"
          GIRAFFE_KEY_ALIAS: "${{ secrets.GIRAFFE_KEY_ALIAS }}"
        run: |
          [ -n "$GIRAFFE_KEYSTORE_PASSWORD" ] || unset GIRAFFE_KEYSTORE_PASSWORD GIRAFFE_KEY_ALIAS
          ./build-apk.sh
          mkdir -p ../out
          for f in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release.apk$//')
            cp "$f" "../out/giraffe-music-$abi.apk"
          done
      - uses: actions/upload-artifact@v5
        with: { name: giraffe-music-apk, path: out/*.apk }
      - name: Notas del release
        if: env.VERSION != ''
        run: |
          # La versión siempre con "v" adelante; notas de mobile/release-notes/vX.Y.Z.md si existe.
          v="v${VERSION#v}"
          echo "TAG=$v" >> "$GITHUB_ENV"
          f="mobile/release-notes/$v.md"
          [ -f "$f" ] || { echo "Giraffe Music ${v#v}" > "$RUNNER_TEMP/notes.md"; f="$RUNNER_TEMP/notes.md"; }
          echo "NOTES=$f" >> "$GITHUB_ENV"
      - name: Release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Giraffe Music ${{ env.TAG }}
          files: out/*.apk
          body_path: ${{ env.NOTES }}
          make_latest: true
